[project]
name = "sceneport"
version = "0.1.0"
description = "Lightweight 3D scene I/O in Python + numpy: native FBX, USD via usd-core, trimesh conversion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "trimesh>=4.0",
    "usd-core>=24.8",
]

[project.scripts]
sceneport = "sceneport.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # also makes tests/conftest.py's --fetch-samples option available to a bare `pytest`

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
