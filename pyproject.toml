[project]
name = "fbxio"
version = "0.1.0"
description = "Minimal FBX reader/writer in pure Python + numpy, no bpy required."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.scripts]
fbxio = "fbxio.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
