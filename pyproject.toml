[project]
name = "sceneport"
version = "0.1.0"
description = "Lightweight 3D scene I/O in pure Python + numpy: native FBX read/write, trimesh conversion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "trimesh>=4.0",
]

[project.scripts]
sceneport = "sceneport.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
